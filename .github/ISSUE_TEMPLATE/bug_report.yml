name: Bug report
description: Something doesn't work as the docs say it should.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - '@vunset/vue'
        - '@vunset/ui'
        - '@vunset/nuxt'
        - '@vunset/utils'
        - Docs site
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From your lockfile or `npm ls @vunset/vue`.
      placeholder: 1.0.0-rc.5
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Select, AppDialog, useToast…
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproduction
      description: A StackBlitz or a small repo. A docs example with the smallest change that breaks it works well.
      placeholder: https://stackblitz.com/…
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Safari 19, macOS 26 / Chrome on Android, with TalkBack
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Console errors, screenshots, a screen reader's output.
